[project]
name = "titan-audit"
version = "1.0.0"
description = "Reproducible, Ed25519-signed verification & semantic vacuity audit CLI for Lean 4 / Lake projects and autonomous formalization agents."
readme = "README.md"
authors = [
  { name = "Benjamin Stanley Frohman", email = "frohmanbenjamin@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
  "lean4",
  "mathlib",
  "formal-verification",
  "theorem-proving",
  "specification-gaming",
  "semantic-vacuity",
  "ed25519",
  "ai-safety"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
  "cryptography>=41.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[project.urls]
Homepage = "https://github.com/BenFrohman/titan-audit"
Repository = "https://github.com/BenFrohman/titan-audit"
Documentation = "https://doi.org/10.5281/zenodo.23630648"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.23630648"
"Author ORCID" = "https://orcid.org/0009-0006-7068-3718"

[project.scripts]
titan-audit = "titan_audit.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["titan_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
