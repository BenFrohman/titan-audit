name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-cli-tests:
    name: Python unit and CLI tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package via pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest -v

      - name: Verify reference NS_Millennium_Proof Ed25519 attestation
        run: titan-audit verify examples/ns_millennium_proof_audit/report.json

  lean-kernel-gate:
    name: LeanKernelGate green build and axiom audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean-kernel-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run green-build and axiom gate
        run: bash ./check.sh
